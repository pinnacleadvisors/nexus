# Coolify resource template for the Claude Code gateway.
#
# Mount /root/.claude from a persistent Coolify volume so the OAuth token from
# `claude login` survives restarts. The Cloudflare Tunnel ingress (configured
# outside Coolify) maps claude-gw.<your-domain> -> claude-gateway:3000.
#
# Networks: in Coolify v4 each Compose service gets its own private network.
# We additionally attach to the shared external `coolify` network so a
# cloudflared container running there can resolve us by the alias
# `claude-gateway` regardless of the auto-suffixed container name. Survives
# redeploys; no need to manually `docker network connect` after each one.

services:
  claude-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      # Doppler is the single source of truth for secrets. The container's
      # ENTRYPOINT wraps the real command in `doppler run --`, which pulls
      # every var below from Doppler at boot and injects them into process.env.
      # The only env Coolify needs to provide is DOPPLER_TOKEN (a service
      # token scoped to the Doppler config that holds these secrets).
      #
      # Vars expected at runtime (all populated in Doppler):
      #   CLAUDE_GATEWAY_PORT, CLAUDE_GATEWAY_BEARER, NEXUS_REPO_URL,
      #   CLAUDE_GATEWAY_REPO_REF, QUEUE_MAX_DEPTH, REQUEST_TIMEOUT_MS,
      #   COMPOSIO_API_KEY, NEXT_PUBLIC_SUPABASE_URL,
      #   SUPABASE_SERVICE_ROLE_KEY, NEXUS_OPERATOR_USER_ID,
      #   MCP_USE_RUBE_FALLBACK, MEMORY_HQ_TOKEN, NEXUS_BASE_URL
      # See docs/runbooks/doppler-coolify-sync.md for setup.
      DOPPLER_TOKEN: "${DOPPLER_TOKEN}"
    volumes:
      - claude_home:/root/.claude
      - nexus_repo:/repo
    expose:
      - "3000"
    networks:
      default: {}
      coolify:
        aliases:
          - claude-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout:  5s
      retries:  3

volumes:
  claude_home:
  nexus_repo:

networks:
  coolify:
    external: true

