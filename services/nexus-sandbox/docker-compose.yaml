# Coolify resource template — rootless-Podman sandbox.
#
# Exposes POST /exec on port 8080. Auth via NEXUS_SANDBOX_TOKEN bearer.
# Network alias `nexus-sandbox` makes it resolvable from nexus-app on the
# shared `coolify` network.

services:
  nexus-sandbox:
    build:
      context: .
      dockerfile: Containerfile
    pull_policy: build
    restart: unless-stopped

    # Nested Podman needs CAP_SYS_ADMIN for user-namespace setup.
    # Lean-mode trade-off: ONE tenant (the owner), so the blast radius of
    # a sandbox escape is the host itself — the same blast radius the owner
    # already has. When scale mode returns, swap this for a stricter setup
    # (gVisor or Firecracker) before letting customer code anywhere near it.
    privileged: true

    environment:
      # Doppler-sourced — only DOPPLER_TOKEN needs to be in Coolify. Everything
      # else (NEXUS_SANDBOX_TOKEN + sandbox tuning) flows from Doppler at boot
      # via `doppler run --` in the CMD.
      #
      # Vars expected at runtime (all in Doppler):
      #   SANDBOX_PORT, NEXUS_SANDBOX_TOKEN, SANDBOX_DEFAULT_IMAGE,
      #   SANDBOX_DEFAULT_TIMEOUT_MS, SANDBOX_MAX_OUTPUT_BYTES,
      #   SANDBOX_MAX_MEMORY, SANDBOX_MAX_CPUS, SANDBOX_ALLOW_HOST_NETWORK
      # See docs/runbooks/doppler-coolify-sync.md.
      DOPPLER_TOKEN: "${DOPPLER_TOKEN}"

    expose:
      - "8080"
    networks:
      default: {}
      coolify:
        aliases:
          - nexus-sandbox
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout:  5s
      retries:  3

networks:
  coolify:
    external: true
