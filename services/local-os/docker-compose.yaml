# Local "personal OS" Compose — runs the Nexus stack on the operator's Mac mini
# under OrbStack, replacing the Hostinger/Coolify host. See
# task_plan-local-os-migration.md for the full migration plan.
#
# This file `include:`s the unmodified per-service Compose templates and adds
# ONLY the two things they need to run locally instead of inside Coolify:
#   1. localhost port publishing (Coolify did this via its reverse proxy).
#   2. nothing else — networks/volumes/build all inherit from the originals.
#
# The per-service files declare an EXTERNAL network named `coolify`; we create a
# local docker network of that same name (`docker network create coolify`) so
# the includes resolve unmodified. A `cloudflared` service is added in Phase 2.
#
# Secrets: each container self-fetches from Doppler via its own DOPPLER_TOKEN
# (the only var here). Provide it via services/local-os/.env (gitignored) — a
# Doppler SERVICE TOKEN scoped to nexus/prd. Mirrors the Coolify env pane.
#
# Usage (Phase 1 — app + gateways only):
#   docker network create coolify   # once
#   docker compose -f services/local-os/docker-compose.yaml up -d --build
#
# Phase 1 scope: nexus-app, claude-gateway, codex-gateway.
# Phases 3+ add: n8n, nexus-sandbox, qa-runner, firecrawl.

include:
  - ../lean-deploy/docker-compose.yaml
  - ../claude-gateway/docker-compose.yaml
  - ../codex-gateway/docker-compose.yaml
  - ../nexus-sandbox/docker-compose.yaml
  # n8n intentionally NOT included — left running on KVM4 (no substantial
  # workflows to migrate, per operator 2026-06-04). n8n.coolifycloudtunnel.uk
  # DNS stays pointed at the KVM4 tunnel.

services:
  # Publish each service on loopback so we can smoke-test before the tunnel
  # exists. The tunnel (Phase 2) talks to them over the `coolify` network by
  # alias, so these published ports are for local verification only.
  nexus-app:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Next.js standalone binds to $HOSTNAME, which Docker sets to the container
      # ID -> it listens ONLY on the eth0 IP, so localhost healthchecks + the
      # host port-forward miss it. Bind to all interfaces locally. (On Coolify
      # this was masked because cloudflared reached it via the network alias.)
      HOSTNAME: "0.0.0.0"

  claude-gateway:
    ports:
      - "127.0.0.1:3001:3000"

  codex-gateway:
    ports:
      - "127.0.0.1:3002:3000"

  # Local cron scheduler — supercronic firing /api/cron/* on the internal app
  # URL, replacing cron-job.org. Crontab is generated from vercel.json at start
  # (edit vercel.json, then `compose restart cron-runner`). Monitor with
  # `docker compose -f services/local-os/docker-compose.yaml logs -f cron-runner`.
  cron-runner:
    build:
      context: ./cron
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      DOPPLER_TOKEN: "${DOPPLER_TOKEN}"
      CRON_TARGET: "http://nexus-app:3000"
      CRONS_JSON: "/app/cron/crons.json"
    volumes:
      # Live-editable control surface: edit cron/crons.json then
      # `compose restart cron-runner`. No rebuild needed.
      - ./cron:/app/cron:ro
    networks:
      coolify:
        aliases:
          - cron-runner
    depends_on:
      - nexus-app

  # Cloudflare Tunnel connector for the `nexus-mac` tunnel. Replaces the KVM4
  # cloudflared. Resolves services by their `coolify`-network alias. Public
  # hostnames are flipped to this tunnel via DNS (see cloudflared/config.yml).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      coolify:
        aliases:
          - cloudflared
    depends_on:
      - nexus-app
