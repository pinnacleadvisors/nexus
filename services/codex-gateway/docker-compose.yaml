# Coolify resource template for the Codex CLI gateway.
#
# Mount /root/.codex from a persistent Coolify volume so the OAuth token from
# `codex login` survives restarts. The Cloudflare Tunnel ingress (configured
# outside Coolify) maps codex-gw.<your-domain> -> codex-gateway:3000.
#
# Networks: in Coolify v4 each Compose service gets its own private network.
# We additionally attach to the shared external `coolify` network so a
# cloudflared container running there can resolve us by the alias
# `codex-gateway` regardless of the auto-suffixed container name. Survives
# redeploys; no need to manually `docker network connect` after each one.

services:
  codex-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      # Doppler-sourced — only DOPPLER_TOKEN needs to be set in Coolify.
      # All secrets (CODEX_GATEWAY_BEARER_TOKEN, CODEX_AUTH_JSON, etc.) flow
      # from Doppler at boot via `doppler run --` in the ENTRYPOINT.
      #
      # Vars expected at runtime (all in Doppler):
      #   CODEX_GATEWAY_PORT, CODEX_GATEWAY_BEARER_TOKEN, NEXUS_REPO_URL,
      #   CODEX_GATEWAY_REPO_REF, CODEX_MODEL, QUEUE_MAX_DEPTH,
      #   REQUEST_TIMEOUT_MS, CODEX_AUTH_JSON, CODEX_AUTH_JSON_FORCE,
      #   CODEX_API_KEY
      # See docs/runbooks/doppler-coolify-sync.md.
      DOPPLER_TOKEN: "${DOPPLER_TOKEN}"
    volumes:
      - codex_home:/root/.codex
      - nexus_repo:/repo
    expose:
      - "3000"
    networks:
      default: {}
      coolify:
        aliases:
          - codex-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout:  5s
      retries:  3

volumes:
  codex_home:
  nexus_repo:

networks:
  coolify:
    external: true
