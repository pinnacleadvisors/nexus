# Coolify resource template for n8n.
#
# Migrated from the standalone n8n container on Hostinger KVM1 (which expires
# 2026-05-22). Behind Cloudflare Tunnel — `n8n.<your-domain>` maps to
# n8n:5678 via the cloudflared sidecar on the same Coolify host.
#
# Data persistence: /home/node/.n8n holds workflows + credentials +
# executions in SQLite by default. Volume survives container restarts and
# redeploys. For prod-grade reliability, switch DB_TYPE to postgresdb and
# point at the shared Coolify Postgres instance (see commented block).
#
# CRITICAL: N8N_ENCRYPTION_KEY must MATCH the value from the old KVM1
# container — workflows whose credentials were encrypted with the old key
# cannot decrypt under a new one. See docs/runbooks/n8n-kvm1-to-coolify.md
# for the export+import procedure.

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      # Internal-only — the Cloudflare Tunnel handles the public ingress.
      # Coolify auto-binds this to 127.0.0.1:5678 on the host so other
      # containers can reach it as `n8n:5678` on the shared network.
      - "5678:5678"
    environment:
      # ── Auth ────────────────────────────────────────────────────────────
      # Lock the public UI behind basic auth. Cloudflare Tunnel adds zero-trust
      # gating in front; this is defense-in-depth.
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}

      # ── Networking ──────────────────────────────────────────────────────
      # Public-facing host (Cloudflare Tunnel decides what this maps to).
      - N8N_HOST=${N8N_HOST:-n8n.coolifycloudtunnel.uk}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      # Webhook callbacks (Stripe, etc.) hit this URL. Without it n8n returns
      # 127.0.0.1 in webhook URLs which breaks all external integrations.
      - WEBHOOK_URL=${WEBHOOK_URL:-https://n8n.coolifycloudtunnel.uk/}

      # ── Encryption ──────────────────────────────────────────────────────
      # MUST be the same value as the old KVM1 container, otherwise
      # workflow credentials cannot be decrypted after migration. Pulled
      # from Doppler.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # ── Database ────────────────────────────────────────────────────────
      # SQLite default — simplest path for migration. The whole
      # /home/node/.n8n volume contains database.sqlite + nodes + binaryData.
      - DB_TYPE=sqlite
      # Uncomment to switch to Postgres once we want a prod-grade backing
      # store. Requires a postgres container on the same Coolify host.
      # - DB_TYPE=postgresdb
      # - DB_POSTGRESDB_HOST=postgres
      # - DB_POSTGRESDB_PORT=5432
      # - DB_POSTGRESDB_DATABASE=n8n
      # - DB_POSTGRESDB_USER=n8n
      # - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      # ── Timezone ────────────────────────────────────────────────────────
      - GENERIC_TIMEZONE=${TZ:-UTC}
      - TZ=${TZ:-UTC}

      # ── Execution policy ────────────────────────────────────────────────
      # Drop finished execution data older than 7 days — the SQLite file
      # otherwise grows unbounded. Adjust if a workflow needs longer audit.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168     # hours = 7 days
      - EXECUTIONS_DATA_PRUNE_TIMEOUT=3600

      # ── Telemetry off ───────────────────────────────────────────────────
      # n8n's anonymous usage telemetry pings external endpoints. Disable
      # for predictable network behavior + tighter CSP.
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=true     # the templates gallery is read-only fetch — keep on

    volumes:
      # Persistent volume — Coolify creates this on first deploy. Survives
      # container redeploys. Holds database.sqlite + binaryData/* + .config
      # (encryption key state) + .ssh (if used by SSH nodes).
      - n8n_data:/home/node/.n8n

    networks:
      # Coolify auto-creates a private bridge per project; we attach to
      # the shared `coolify` network so the cloudflared sidecar can resolve
      # this container as `n8n` regardless of the auto-suffixed name.
      - default
      - coolify

    healthcheck:
      # n8n's /healthz endpoint returns 200 once the migration step
      # (sqlite schema upgrade on first boot) completes. Coolify uses this
      # to gate "Running" status — without it, a slow first-boot looks like
      # a deploy failure.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  n8n_data:

networks:
  coolify:
    external: true
