# Coolify resource template — Nexus platform (lean mode).
#
# This Compose hosts ONLY the Next.js app. The full lean stack is FOUR
# Coolify apps on the same KVM, deployed independently from these paths:
#
#   1. services/lean-deploy/         (this file — nexus-app)
#   2. services/claude-gateway/      (Claude Code CLI gateway)
#   3. services/codex-gateway/       (Codex CLI gateway)
#   4. services/nexus-sandbox/       (rootless Podman exec sandbox)
#
# All four attach to the shared external `coolify` network so a cloudflared
# container can resolve them by alias. See README.md for full setup.

services:
  nexus-app:
    build:
      context: ../..
      dockerfile: services/lean-deploy/Dockerfile
      # Pass DOPPLER_TOKEN through to `next build` as a BuildKit secret so
      # NEXT_PUBLIC_* vars (Clerk, Supabase, Sentry public DSN) are inlined
      # into the client bundle with their real values instead of `undefined`.
      # The secret value never lands in image layers or `docker history`.
      # In Coolify: declare a build-time secret named `doppler_token` whose
      # value is the same DOPPLER_TOKEN env var below.
      secrets:
        - doppler_token
    pull_policy: build
    restart: unless-stopped
    environment:
      # Doppler-sourced — only DOPPLER_TOKEN needs to be in Coolify. Every
      # other env var (Clerk, Supabase, gateway bearers, LLM providers,
      # Stripe, etc.) flows from Doppler at boot via `doppler run --` in the
      # CMD.
      #
      # Vars expected at runtime (all in Doppler):
      #   LEAN_MODE, LEAN_USER_DAILY_USD_LIMIT, LLM_PROVIDER,
      #   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY, ALLOWED_USER_IDS,
      #   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
      #   SUPABASE_SERVICE_ROLE_KEY,
      #   CLAUDE_CODE_GATEWAY_URL, CLAUDE_CODE_BEARER_TOKEN,
      #   CODEX_GATEWAY_URL, CODEX_GATEWAY_BEARER_TOKEN,
      #   ANTHROPIC_API_KEY, MIMO_API_KEY, MIMO_BASE_URL, OLLAMA_BASE_URL,
      #   NEXUS_SANDBOX_URL, NEXUS_SANDBOX_TOKEN,
      #   MEMORY_HQ_TOKEN, MEMORY_HQ_REPO, COMPOSIO_API_KEY,
      #   STRIPE_WEBHOOK_SECRET, NEXUS_OPS_TOKEN, CRON_SECRET
      # See docs/runbooks/doppler-coolify-sync.md.
      DOPPLER_TOKEN: "${DOPPLER_TOKEN}"

    expose:
      - "3000"
    networks:
      default: {}
      coolify:
        aliases:
          - nexus-app
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout:  5s
      retries:  3

networks:
  coolify:
    external: true

# BuildKit secret declaration — Coolify wires this from the app's build-time
# secret of the same id (the operator sets it in the Coolify UI under
# Build Secrets, pointing at the same DOPPLER_TOKEN value used at runtime).
secrets:
  doppler_token:
    environment: DOPPLER_TOKEN
