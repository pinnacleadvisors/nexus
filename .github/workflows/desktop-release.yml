name: Desktop binary release (Tauri)

# Builds macOS (universal), Windows (x64), Linux (amd64) bundles when a
# tag matching `desktop-v*` is pushed. Each successful build uploads
# installers to a GitHub Release.
#
# Operator workflow:
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
#
# Drafts the release; operator adds notes + publishes.

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'      # Apple Silicon universal
            args:     '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args:     ''
          - platform: 'windows-latest'
            args:     ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Generate platform icons from SVG
        working-directory: apps/desktop
        run: |
          npx @tauri-apps/cli icon ../../public/icon.svg --output src-tauri/icons || \
            echo "::warning::tauri icon generation failed — bundle may be missing icons"

      - name: Build the desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath:  apps/desktop
          tagName:      ${{ github.ref_name }}
          releaseName:  'Nexus ${{ github.ref_name }}'
          releaseDraft: true
          prerelease:   false
          args:         ${{ matrix.args }}
